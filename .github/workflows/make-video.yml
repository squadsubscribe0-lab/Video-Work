name: Make video

# Two ways to order a video:
#  1. Actions tab -> "Make video" -> Run workflow, and type the prompt.
#  2. Add or edit a file in requests/*.json and push (see requests/README.md).
# The finished MP4 is attached to the run under "Artifacts".

# Runs started from the web studio (site/) are named "<title> [<request_id>]" so the page can find them.
run-name: ${{ inputs.request_id && format('{0} [{1}]', inputs.title, inputs.request_id) || inputs.prompt || 'Make video' }}

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Topic / brief for the video (leave empty when you give a script)"
        required: false
      title:
        description: "Video title (with script)"
        required: false
      script:
        description: "Your own narration, used word for word (instead of a prompt)"
        required: false
      captions:
        description: "Captions: bold, subtle or none"
        default: "bold"
      theme:
        description: "Colour theme: auto, midnight, sunset, ocean, forest"
        default: "auto"
      request_id:
        description: "Set by the web studio; the video is published as release video-<request_id>"
        required: false
      minutes:
        description: "Target length in minutes"
        default: "2"
      language:
        description: "Narration language (en-US, hi-IN, ur-PK, ...)"
        default: "en-US"
      tts:
        description: "Voice engine"
        type: choice
        options: [edge, elevenlabs, kokoro, mock]
        default: edge
  push:
    paths:
      - "requests/*.json"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      requests: ${{ steps.list.outputs.requests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        name: Find requests to render
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PROMPT: ${{ inputs.prompt }}
          MINUTES: ${{ inputs.minutes }}
          LANGUAGE: ${{ inputs.language }}
          TTS: ${{ inputs.tts }}
          TITLE: ${{ inputs.title }}
          SCRIPT: ${{ inputs.script }}
          CAPTIONS: ${{ inputs.captions }}
          THEME: ${{ inputs.theme }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # The form becomes a one-off request, passed to the render job as JSON.
            req=$(jq -cn --arg p "$PROMPT" --arg m "${MINUTES:-2}" --arg l "${LANGUAGE:-en-US}" --arg t "${TTS:-edge}" \
              --arg title "$TITLE" --arg script "$SCRIPT" --arg c "${CAPTIONS:-bold}" --arg th "${THEME:-auto}" \
              '{minutes:($m|tonumber), language:$l, tts:$t, captions:$c, theme:$th}
               + (if $script != "" then {title:$title, script:$script} else {prompt:$p} end)')
            name=manual
            if [ -n "$REQUEST_ID" ]; then name="$REQUEST_ID"; fi
            if ! [[ "$name" =~ ^[A-Za-z0-9_-]+$ ]]; then echo "Bad request_id"; exit 1; fi
            echo "requests=$(jq -cn --argjson r "$req" --arg n "$name" '[{name:$n, inline:$r, release:($n != "manual")}]')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            files=$(git diff-tree --no-commit-id --name-only --diff-filter=AM -r "$AFTER" -- 'requests/*.json')
          else
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'requests/*.json')
          fi
          echo "Requests: $files"
          echo "requests=$(printf '%s\n' $files | jq -R 'select(length>0) | {name: (split("/")[-1] | rtrimstr(".json")), file: .}' | jq -cs .)" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    if: needs.plan.outputs.requests != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish web-studio videos as releases
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        request: ${{ fromJson(needs.plan.outputs.requests) }}
    name: render (${{ matrix.request.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg and fonts (emoji, Devanagari, Arabic/Urdu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-noto-ui-core >/dev/null
      - run: npm ci --no-fund --no-audit
      - name: Install offline fallback voice (Kokoro, used only if Edge TTS is down)
        continue-on-error: true
        run: npm install --no-save --no-fund --no-audit kokoro-js@1.2.1
      - name: Prepare headless browser
        # Playwright's headless Chromium can create WebGL contexts (for the 3D scenes)
        # on GPU-less runners with the "angle" backend; Remotion's default download can't.
        run: |
          npx -y playwright@1.56.0 install --only-shell chromium
          echo "REMOTION_BROWSER_EXECUTABLE=$(find ~/.cache/ms-playwright -type f -name headless_shell | head -1)" >> "$GITHUB_ENV"
      - name: Make the video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REQUEST_FILE: ${{ matrix.request.file }}
          REQUEST_INLINE: ${{ toJson(matrix.request.inline) }}
          NAME: ${{ matrix.request.name }}
        run: |
          if [ -z "$REQUEST_FILE" ]; then
            REQUEST_FILE="$RUNNER_TEMP/request.json"
            printf '%s' "$REQUEST_INLINE" > "$REQUEST_FILE"
          fi
          npx tsx src/pipeline/request.ts "$REQUEST_FILE" "jobs/$NAME"
      - name: Summary
        if: always()
        env:
          NAME: ${{ matrix.request.name }}
        run: |
          if [ -f "jobs/$NAME/video.mp4" ]; then
            title=$(jq -r .title "jobs/$NAME/plan.json")
            secs=$(jq '[.scenes[] | .durationInFrames - .transitionFrames] | add / 30 | floor' "jobs/$NAME/props.json")
            echo "### ✅ $title ($((secs / 60))m $((secs % 60))s)" >> "$GITHUB_STEP_SUMMARY"
            echo "Download it from **Artifacts** below: \`video-$NAME\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ No video was produced for \`$NAME\` - see the logs above." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish to the web studio
        # Videos ordered from the web page become a release, so the page can play and download them.
        if: matrix.request.release && hashFiles(format('jobs/{0}/video.mp4', matrix.request.name)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.request.name }}
        run: |
          title=$(jq -r .title "jobs/$NAME/plan.json")
          cp "jobs/$NAME/video.mp4" "$RUNNER_TEMP/video.mp4"
          gh release create "video-$NAME" "$RUNNER_TEMP/video.mp4" "jobs/$NAME/plan.json" \
            --title "🎬 $title" --notes "Made with the Video Studio. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --target "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ matrix.request.name }}
          path: |
            jobs/${{ matrix.request.name }}/video.mp4
            jobs/${{ matrix.request.name }}/plan.json
            jobs/${{ matrix.request.name }}/credits.txt
          if-no-files-found: ignore
          retention-days: 30
